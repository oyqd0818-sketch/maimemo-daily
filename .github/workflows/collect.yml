name: Collect Maimemo Daily Words

on:
  schedule:
    # Asia/Taipei 23:50 = UTC 15:50
    - cron: "50 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maimemo-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect today's study data
        env:
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
        run: python scripts/collect.py

      - name: Commit study data
        run: |
          git config user.name "maimemo-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Save Maimemo study data for $(TZ=Asia/Taipei date +%F)"
            git push
          fi
